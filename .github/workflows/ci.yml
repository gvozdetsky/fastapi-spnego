name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Callable from other workflows (e.g. publish.yml gates releases on a green CI).
  workflow_call:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history + tags so setuptools_scm can derive the version
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync dependencies (locked)
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy fastapi_spnego

  test:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Sync dependencies (locked)
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Run unit tests
        run: >-
          uv run --python ${{ matrix.python-version }}
          pytest -q --cov=fastapi_spnego --cov-report=term-missing

  integration:
    name: End-to-end (real KDC)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # Stands up an MIT KDC + app + client and runs the real Negotiate
      # handshake, mutual auth, and delegation. See docker-compose.yml.
      - name: Run KDC integration suite
        run: docker compose run --rm --build test
      - name: Tear down
        if: always()
        run: docker compose down -v

  integration-native:
    name: End-to-end (in-process KDC, no Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # k5test drives a KDC in-process; it needs libkrb5-dev to build the gssapi
      # wheel plus the MIT server tools (krb5kdc, kadmin.local, kdb5_util, kinit).
      - name: Install system Kerberos stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libkrb5-dev krb5-kdc krb5-admin-server krb5-user
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync dependencies (locked, with gssapi extras)
        run: uv sync --locked --group gssapi
      - name: Run in-process KDC handshake test
        run: uv run pytest tests/integration/test_k5_end_to_end.py -v
