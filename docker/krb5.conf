# Shared Kerberos client/KDC config for the fastapi-spnego dev environment.
# Mounted read-only into every container. The realm is self-contained; the KDC
# is reachable at the compose service name `kdc`.
[libdefaults]
    default_realm = EXAMPLE.COM
    dns_lookup_realm = false
    dns_lookup_kdc = false
    # Keep SPNs literal — compose service names ("app", "kdc") are not real DNS
    # names, so any canonicalization/reverse lookup would break the match.
    rdns = false
    dns_canonicalize_hostname = false
    forwardable = true
    # Prefer TCP; UDP inside compose can silently drop large tickets.
    udp_preference_limit = 1

[realms]
    EXAMPLE.COM = {
        kdc = kdc
        admin_server = kdc
    }

[domain_realm]
    .example.com = EXAMPLE.COM
    example.com = EXAMPLE.COM
